<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfall</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000510;
            font-family: 'Times New Roman', serif;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column;
            align-items: center;
            padding-top: 40px;
            box-sizing: border-box;
        }

        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000510; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text { color: #44aacc; font-size: 14px; letter-spacing: 4px; margin-top: 20px; text-transform: uppercase; font-weight: 100; }
        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(68, 170, 204, 0.2);
            border-top: 1px solid #44aacc; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h1 {
            color: #88ddff; font-size: 52px; margin: 0; font-weight: 400;
            letter-spacing: 6px;
            text-shadow: 0 0 50px rgba(100, 200, 255, 0.5);
            background: linear-gradient(to bottom, #fff, #55aacc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Times New Roman', serif;
            opacity: 0.9;
        }

        .controls-wrapper {
            position: absolute;
            top: 30px; right: 30px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 20;
        }

        .upload-btn {
            background: rgba(10, 20, 40, 0.7);
            border: 1px solid rgba(68, 170, 204, 0.4);
            color: #55aacc;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10px;
            transition: all 0.4s;
            backdrop-filter: blur(5px);
            min-width: 120px;
        }
        .upload-btn:hover {
            background: #226688;
            color: #fff;
            box-shadow: 0 0 20px rgba(50, 150, 200, 0.5);
        }
        .hint-text {
            color: rgba(100, 170, 220, 0.5);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: right;
            margin-top: 5px;
        }

        #webcam-wrapper {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 280px; height: 210px;
            border: 1px solid rgba(68, 170, 204, 0.5);
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            opacity: 1;
            pointer-events: none;
            z-index: 50;
            background: #000;
            transition: opacity 0.5s ease;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #debug-info {
            position: absolute;
            bottom: 5px; left: 5px;
            color: rgba(100, 200, 220, 0.8);
            font-size: 10px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            pointer-events: none;
        }
    </style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Waterfall</div>
    </div>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <h1>Waterfall</h1>
        <div class="controls-wrapper">
            <button class="upload-btn" id="toggle-camera-btn">Hide Camera</button>
            <div class="hint-text">1~5 fingers → flow density</div>
            <div class="hint-text">Index finger circle → twist</div>
        </div>
    </div>
    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div id="debug-info">Initializing...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        const STATE = {
            fingerCount: 3,
            targetFingerCount: 3,
            twist: 0,
            twistSpeed: 0,
            targetTwistSpeed: 0,
            hand: { detected: false },
        };

        let scene, camera, renderer, composer;
        let clock = new THREE.Clock();
        let waterfallPoints, splashPoints, mistPoints;
        let waterfallGeo, splashGeo, mistGeo;
        let handLandmarker, video;
        const debugInfo = document.getElementById('debug-info');

        // Circle detection
        let indexTipHistory = [];

        // Particle data stored in parallel arrays
        let wData = []; // { baseX, baseZ, speed, timeOffset, layer }
        let sData = [];
        let mData = [];

        const WCOUNT = 6000;
        const SCOUNT = 2000;
        const MCOUNT = 1500;
        const H = 28;
        const W = 26;
        const HALF_H = H / 2;
        const HALF_W = W / 2;

        function init() {
            initThree();
            setupLights();
            createWaterfallCurtain();
            createSplash();
            createMist();
            setupPostProcessing();
            setupEvents();
            initMediaPipe();

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 800);
            animate();
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.FogExp2(0x000510, 0.003);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 2.2;
            container.appendChild(renderer.domElement);
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0x112244, 0.3));
            const top = new THREE.PointLight(0x88ccff, 2, 30);
            top.position.set(0, HALF_H + 2, 8);
            scene.add(top);
            const bot = new THREE.PointLight(0x44aadd, 4, 18);
            bot.position.set(0, -HALF_H, 0);
            scene.add(bot);
        }

        function makeGlowTex(r, g, b) {
            const c = document.createElement('canvas');
            c.width = 32; c.height = 32;
            const ctx = c.getContext('2d');
            const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grd.addColorStop(0, `rgba(${r},${g},${b},1)`);
            grd.addColorStop(0.3, `rgba(${r},${g},${b},0.7)`);
            grd.addColorStop(0.7, `rgba(${Math.floor(r/2)},${Math.floor(g/2)},${Math.floor(b/2)},0.1)`);
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(c);
        }

        function createWaterfallCurtain() {
            waterfallGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(WCOUNT * 3);
            waterfallGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            for (let i = 0; i < WCOUNT; i++) {
                const baseX = (Math.random() - 0.5) * W;
                const baseZ = (Math.random() - 0.5) * 3;
                const speed = 0.12 + Math.random() * 0.4;
                const timeOffset = Math.random() * Math.PI * 2;
                const layer = Math.floor(Math.random() * 3);
                const y = HALF_H + Math.random() * 4;

                positions[i * 3] = baseX;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = baseZ;

                wData.push({ baseX, baseZ, speed, timeOffset, layer, homeY: y });
            }

            waterfallGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const tex = makeGlowTex(120, 210, 255);
            const mat = new THREE.PointsMaterial({
                color: 0x88ccff,
                size: 0.22,
                map: tex,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            waterfallPoints = new THREE.Points(waterfallGeo, mat);
            scene.add(waterfallPoints);
        }

        function createSplash() {
            splashGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(SCOUNT * 3);
            splashGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            for (let i = 0; i < SCOUNT; i++) {
                const baseX = (Math.random() - 0.5) * W * 1.3;
                const baseZ = (Math.random() - 0.5) * 4;
                const speed = 0.3 + Math.random() * 0.8;
                const timeOffset = Math.random() * Math.PI * 2;
                const life = 0.3 + Math.random() * 0.7;
                const decay = 0.6 + Math.random() * 1.5;
                const flyX = (Math.random() - 0.5) * 1.5;
                const flyY = Math.random() * 1.5;
                const flyZ = (Math.random() - 0.5) * 1.5;

                positions[i * 3] = baseX;
                positions[i * 3 + 1] = -HALF_H - 2;
                positions[i * 3 + 2] = baseZ;

                sData.push({ baseX, baseZ, speed, timeOffset, life, decay, flyX, flyY, flyZ, homeY: -HALF_H });
            }

            const tex = makeGlowTex(150, 220, 255);
            const mat = new THREE.PointsMaterial({
                color: 0xaaddff,
                size: 0.18,
                map: tex,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            splashPoints = new THREE.Points(splashGeo, mat);
            scene.add(splashPoints);
        }

        function createMist() {
            mistGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(MCOUNT * 3);
            mistGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            for (let i = 0; i < MCOUNT; i++) {
                const baseX = (Math.random() - 0.5) * W * 1.6;
                const baseZ = (Math.random() - 0.5) * 5;
                const timeOffset = Math.random() * Math.PI * 2;
                const life = 0.3 + Math.random() * 0.7;
                const decay = 0.2 + Math.random() * 0.5;
                const y = -HALF_H - 1 + Math.random() * 5;

                positions[i * 3] = baseX;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = baseZ;

                mData.push({ baseX, baseZ, timeOffset, life, decay, homeY: y });
            }

            const tex = makeGlowTex(80, 160, 240);
            const mat = new THREE.PointsMaterial({
                color: 0x6699cc,
                size: 0.45,
                map: tex,
                transparent: true,
                opacity: 0.35,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            mistPoints = new THREE.Points(mistGeo, mat);
            scene.add(mistPoints);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloom.threshold = 0.25;
            bloom.strength = 1.3;
            bloom.radius = 0.5;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloom);
        }

        function countExtendedFingers(lm) {
            let count = 0;
            const wrist = lm[0];

            const thumbTip = lm[4], thumbIp = lm[3];
            if (Math.abs(thumbTip.x - wrist.x) > Math.abs(thumbIp.x - wrist.x) * 1.1) count++;

            [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([tip, pip]) => {
                const td = Math.hypot(lm[tip].x - wrist.x, lm[tip].y - wrist.y);
                const pd = Math.hypot(lm[pip].x - wrist.x, lm[pip].y - wrist.y);
                if (td > pd * 1.0) count++;
            });
            return count;
        }

        function detectCircle(indexTip, wrist) {
            const rx = indexTip.x - wrist.x;
            const ry = indexTip.y - wrist.y;
            indexTipHistory.push({ x: rx, y: ry, time: performance.now() });
            if (indexTipHistory.length > 20) indexTipHistory.shift();
            if (indexTipHistory.length < 8) return 0;

            let totalAngle = 0;
            for (let i = 1; i < indexTipHistory.length; i++) {
                const pa = Math.atan2(indexTipHistory[i - 1].y, indexTipHistory[i - 1].x);
                const ca = Math.atan2(indexTipHistory[i].y, indexTipHistory[i].x);
                let diff = ca - pa;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                totalAngle += diff;
            }
            const dt = (indexTipHistory[indexTipHistory.length - 1].time - indexTipHistory[0].time) / 1000;
            if (dt < 0.05) return 0;
            const av = totalAngle / dt;
            return Math.abs(av) < 0.8 ? 0 : av;
        }

        async function initMediaPipe() {
            video = document.getElementById('webcam');
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: 'https://cdn.jsdelivr.net/gh/kunkunwang332-star/love520@master/hand_landmarker.task', delegate: "GPU" },
                runningMode: "VIDEO",
                numHands: 1
            });
            if (navigator.mediaDevices?.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
                    });
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    debugInfo.innerText = "1~5 fingers | Draw circle";
                } catch (e) {
                    debugInfo.innerText = "Camera error";
                    document.getElementById('webcam-wrapper').style.display = 'none';
                }
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.targetFingerCount = countExtendedFingers(lm);
                STATE.targetTwistSpeed = detectCircle(lm[8], lm[0]) * 0.4;
                debugInfo.innerText = `Fingers: ${STATE.targetFingerCount} | Twist: ${STATE.targetTwistSpeed.toFixed(2)}`;
            } else {
                STATE.hand.detected = false;
                STATE.targetTwistSpeed = 0;
                debugInfo.innerText = "No hand detected";
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('toggle-camera-btn').addEventListener('click', () => {
                const w = document.getElementById('webcam-wrapper');
                const b = document.getElementById('toggle-camera-btn');
                if (w.style.display === 'none') { w.style.display = 'block'; b.textContent = 'Hide Camera'; }
                else { w.style.display = 'none'; b.textContent = 'Show Camera'; }
            });
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    document.querySelector('.controls-wrapper')?.classList.toggle('ui-hidden');
                    document.getElementById('webcam-wrapper')?.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const t = clock.elapsedTime;

            // Smooth state
            STATE.fingerCount += (STATE.targetFingerCount - STATE.fingerCount) * Math.min(dt * 3, 1);
            STATE.twistSpeed += (STATE.targetTwistSpeed - STATE.twistSpeed) * Math.min(dt * 4, 1);
            if (!STATE.hand.detected) {
                STATE.twistSpeed += (0 - STATE.twistSpeed) * Math.min(dt * 1.5, 1);
                if (Math.abs(STATE.twistSpeed) < 0.005) STATE.twistSpeed = 0;
            }
            STATE.twist += STATE.twistSpeed * dt;
            STATE.twist *= 0.995;

            const fc = Math.round(STATE.fingerCount);
            const twist = STATE.twist;

            // ── Update waterfall curtain ──
            const wPos = waterfallGeo.attributes.position.array;
            for (let i = 0; i < WCOUNT; i++) {
                const d = wData[i];
                d.homeY -= d.speed * dt * 10;
                if (d.homeY < -HALF_H - 2) d.homeY = HALF_H + Math.random() * 3;

                // Full screen coverage: base position already spans width
                let x = d.baseX;
                let z = d.baseZ;

                // Twist effect based on height fraction
                const hf = (d.homeY + HALF_H) / H;
                const twistAngle = twist * hf * 0.6;
                const cosT = Math.cos(twistAngle);
                const sinT = Math.sin(twistAngle);
                x = d.baseX * cosT - d.baseZ * sinT;
                z = d.baseX * sinT + d.baseZ * cosT;

                // Finger count modulates density distribution
                const fingerFactor = fc / 5;
                const pinch = 1.0 - fingerFactor * 0.7;
                x *= (0.5 + 0.5 * pinch);

                // Subtle wave
                x += Math.sin(t * 3 + d.timeOffset) * 0.1;

                wPos[i * 3] = x;
                wPos[i * 3 + 1] = d.homeY;
                wPos[i * 3 + 2] = z;
            }
            waterfallGeo.attributes.position.needsUpdate = true;

            // ── Update splash ──
            const sPos = splashGeo.attributes.position.array;
            for (let i = 0; i < SCOUNT; i++) {
                const d = sData[i];
                d.life -= d.decay * dt;
                if (d.life <= 0) {
                    d.life = 0.3 + Math.random() * 0.7;
                    d.baseX = (Math.random() - 0.5) * W * 1.3;
                    d.baseZ = (Math.random() - 0.5) * 4;
                    d.flyX = (Math.random() - 0.5) * 1.5;
                    d.flyY = Math.random() * 1.5;
                    d.flyZ = (Math.random() - 0.5) * 1.5;
                }
                const pct = 1 - d.life;
                const x = d.baseX + d.flyX * pct;
                const y = -HALF_H + d.flyY * pct;
                const z = d.baseZ + d.flyZ * pct;

                // Twist
                const hf = (y + HALF_H) / (H * 0.3);
                const ta = twist * Math.max(0, hf) * 0.3;
                const ct = Math.cos(ta), st = Math.sin(ta);

                sPos[i * 3] = x * ct - z * st;
                sPos[i * 3 + 1] = y;
                sPos[i * 3 + 2] = x * st + z * ct;
            }
            splashGeo.attributes.position.needsUpdate = true;
            splashPoints.material.opacity = 0.45 + STATE.twistSpeed * 0.1;

            // ── Update mist ──
            const mPos = mistGeo.attributes.position.array;
            for (let i = 0; i < MCOUNT; i++) {
                const d = mData[i];
                d.life -= d.decay * dt;
                if (d.life <= 0) {
                    d.life = 0.3 + Math.random() * 0.7;
                    d.baseX = (Math.random() - 0.5) * W * 1.6;
                    d.baseZ = (Math.random() - 0.5) * 5;
                }
                const x = d.baseX + Math.sin(t * 1.5 + d.timeOffset) * 0.4;
                const y = d.homeY + Math.cos(t * 1.2 + d.timeOffset) * 0.3;
                const z = d.baseZ + Math.cos(t * 2 + d.timeOffset) * 0.3;

                const ta = twist * 0.15;
                const ct = Math.cos(ta), st = Math.sin(ta);
                mPos[i * 3] = x * ct - z * st;
                mPos[i * 3 + 1] = y;
                mPos[i * 3 + 2] = x * st + z * ct;
            }
            mistGeo.attributes.position.needsUpdate = true;

            camera.position.x += (Math.sin(twist * 0.3) * 2 - camera.position.x) * dt * 2;

            composer.render();
        }

        init();
    </script>
</body>
</html>
