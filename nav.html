<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>520 爱心手势 - 3D 可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景粒子 */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { transform: translateY(80vh) scale(1); opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0.3); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .header {
            text-align: center;
        }
        .header .icon {
            font-size: 48px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d, #c084fc, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 4px;
        }
        .header .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 4px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            backdrop-filter: blur(10px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.96);
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card.card-love {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.25), rgba(255, 107, 157, 0.08));
            border: 1px solid rgba(255, 107, 157, 0.3);
        }
        .card.card-love::after {
            background: radial-gradient(circle at center, rgba(255, 107, 157, 0.15), transparent);
        }
        .card.card-galaxy {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .card.card-galaxy::after {
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15), transparent);
        }
        .card.card-waterfall {
            background: linear-gradient(135deg, rgba(72, 199, 224, 0.25), rgba(72, 199, 224, 0.08));
            border: 1px solid rgba(72, 199, 224, 0.3);
        }
        .card.card-waterfall::after {
            background: radial-gradient(circle at center, rgba(72, 199, 224, 0.15), transparent);
        }

        .card .card-emoji {
            font-size: 40px;
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .card-love .card-emoji { background: rgba(255, 107, 157, 0.2); }
        .card-galaxy .card-emoji { background: rgba(139, 92, 246, 0.2); }
        .card-waterfall .card-emoji { background: rgba(72, 199, 224, 0.2); }

        .card .card-info { flex: 1; min-width: 0; }
        .card .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .card .card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.4;
        }
        .card .card-arrow {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }

        .share-hint {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.6;
        }
        .share-hint .highlight {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        /* canvas 背景爱心 */
        canvas#bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="container">
    <div class="header">
        <div class="icon">💝</div>
        <h1>520 爱心手势</h1>
        <div class="subtitle">用手势控制 3D 场景 · 打开摄像头体验</div>
    </div>

    <div class="cards">
        <a class="card card-love" href="index.html">
            <div class="card-emoji">💖</div>
            <div class="card-info">
                <div class="card-title">爱心树</div>
                <div class="card-desc">520 颗粒子汇聚成旋转爱心树</div>
            </div>
            <div class="card-arrow">›</div>
        </a>

        <a class="card card-galaxy" href="galaxy.html">
            <div class="card-emoji">✨</div>
            <div class="card-info">
                <div class="card-title">星空银河</div>
                <div class="card-desc">绚烂粒子星系与星空漩涡</div>
            </div>
            <div class="card-arrow">›</div>
        </a>

        <a class="card card-waterfall" href="waterfall.html">
            <div class="card-emoji">💧</div>
            <div class="card-info">
                <div class="card-title">梦幻瀑布</div>
                <div class="card-desc">流光粒子瀑布与光带律动</div>
            </div>
            <div class="card-arrow">›</div>
        </a>
    </div>

    <div class="share-hint">
        <span class="highlight">📱 手机打开链接即可体验</span><br>
        需要 HTTPS 才能使用摄像头手势识别<br>
        部署到 GitHub Pages / Vercel 即可获得 HTTPS
    </div>
</div>

<script>
// 背景漂浮小爱心
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let hearts = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function drawHeart(ctx, x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ff6b9d';
    ctx.translate(x, y);
    ctx.scale(size / 30, size / 30);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-15, -15, -30, 5, 0, 20);
    ctx.bezierCurveTo(30, 5, 15, -15, 0, 0);
    ctx.fill();
    ctx.restore();
}

function spawnHeart() {
    return {
        x: Math.random() * canvas.width,
        y: canvas.height + 30,
        size: 6 + Math.random() * 14,
        speed: 0.3 + Math.random() * 0.7,
        alpha: 0.2 + Math.random() * 0.4,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.01 + Math.random() * 0.02,
        wobbleAmp: 0.3 + Math.random() * 0.5
    };
}

// 初始化
for (let i = 0; i < 20; i++) {
    const h = spawnHeart();
    h.y = Math.random() * canvas.height;
    hearts.push(h);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < hearts.length; i++) {
        const h = hearts[i];
        h.y -= h.speed;
        h.wobble += h.wobbleSpeed;
        const wx = Math.sin(h.wobble) * h.wobbleAmp;
        drawHeart(ctx, h.x + wx, h.y, h.size, h.alpha);
        if (h.y < -40) {
            hearts[i] = spawnHeart();
        }
    }

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
